<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pico W LED Control</title>

    <link rel="stylesheet" href="index.css">
    <script src="index.js" defer></script>
</head>

<body>
    <main class="card">
        <h1>Pico W LED</h1>
        <p>Control the onboard LED from your browser.</p>

        <div class="buttons">
            <button class="btn btn-on" onclick="on()">
                🟢 Turn On
            </button>

            <button class="btn btn-off" onclick="off()">
                ⚫ Turn Off
            </button>
        </div>
    </main>
</body>

</html>
